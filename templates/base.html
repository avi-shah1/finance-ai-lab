<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}{% if self.title() %} · {% endif %}M&amp;A Target Screener</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>M&amp;A Target Screener</span>
        </a>
        <nav class="topnav">
            <a href="{{ url_for('home') }}#searches">Searches</a>
            <a href="{{ url_for('home') }}#library">Company library</a>
        </nav>
    </header>

    <main class="page">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}" role="status">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
